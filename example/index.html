<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tv-spatial-nav example</title>
    <style>
      :root { --bg: #0c0a14; --card: #1a1628; --text: #f7f4ff; --muted: #a69ec0; --focus: #ffb547; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text); font: 18px/1.4 system-ui, sans-serif; }
      button { font: inherit; color: inherit; background: var(--card); border: 0; border-radius: 12px; padding: 14px 18px; text-align: left; }
      [data-focus]:focus { outline: 4px solid var(--focus); outline-offset: 2px; }
      nav { display: flex; flex-direction: column; gap: 10px; padding: 24px 16px; border-right: 1px solid #2a2440; }
      nav [data-group-entry] { color: var(--focus); }
      main { flex: 1; padding: 24px; overflow: auto; }
      .row { display: flex; gap: 16px; margin-bottom: 24px; }
      .card { width: 200px; height: 112px; }
      .bar { width: 100%; height: 12px; padding: 0; margin: 8px 0 12px; }
      .dialog { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, 0.6); }
      .dialog > div { background: #15121f; padding: 24px; border-radius: 16px; display: flex; gap: 12px; }
      p { color: var(--muted); }
    </style>
  </head>
  <body>
    <nav data-group>
      <button data-focus data-group-entry>Home</button>
      <button data-focus>Map</button>
      <button data-focus>Friends</button>
    </nav>
    <main data-group>
      <p>Arrow keys move focus, Enter on "Open dialog" traps focus inside it, Escape (Back) closes it.</p>
      <div class="row">
        <button class="card" data-focus data-autofocus>Card 1</button>
        <button class="card" data-focus>Card 2</button>
        <button class="card" data-focus>Card 3</button>
      </div>
      <button class="bar" data-focus aria-label="Scrubber"></button>
      <div class="row">
        <button data-focus>⏯</button>
        <button data-focus>😂</button>
        <button data-focus>❤️</button>
        <button data-focus id="open">Open dialog</button>
      </div>
    </main>
    <div class="dialog" hidden id="dialog">
      <div>
        <button data-focus data-autofocus>Keep watching</button>
        <button data-focus id="close">Leave</button>
      </div>
    </div>
    <script type="module">
      import { createNavigator } from '../src/index.js';
      const dialog = document.getElementById('dialog');
      const nav = createNavigator({
        onKey(key) {
          if (key === 'back' && !dialog.hidden) {
            dialog.hidden = true;
            dialog.removeAttribute('data-trap');
            nav.focusFirst(document.querySelector('main'));
            return true;
          }
        },
      });
      nav.install();
      nav.focusFirst(document.querySelector('main'));
      document.getElementById('open').addEventListener('click', () => {
        dialog.hidden = false;
        dialog.setAttribute('data-trap', '');
        nav.focusFirst(dialog);
      });
      document.getElementById('close').addEventListener('click', () => {
        dialog.hidden = true;
        dialog.removeAttribute('data-trap');
        nav.focusFirst(document.querySelector('main'));
      });
    </script>
  </body>
</html>
